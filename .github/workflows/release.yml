name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: x86_64-windows
            binary: quill.exe
          - os: ubuntu-latest
            name: x86_64-linux
            binary: quill
          - os: macos-latest
            name: aarch64-macos
            binary: quill
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install Linux webview headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build
        run: zig build -Doptimize=ReleaseSmall

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          folder="quill-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$folder"
          cp "zig-out/bin/${{ matrix.binary }}" LICENSE README.md "dist/$folder/"
          tar -czf "dist/$folder.tar.gz" -C dist "$folder"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = "quill-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path "dist/$folder" | Out-Null
          Copy-Item "zig-out/bin/${{ matrix.binary }}", "LICENSE", "README.md" -Destination "dist/$folder"
          Compress-Archive -Path "dist/$folder" -DestinationPath "dist/$folder.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: quill-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quill ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
